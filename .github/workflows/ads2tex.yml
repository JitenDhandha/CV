name: Run ads2tex

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
        default: 'chore: manual CV update'

permissions:
  contents: write

jobs:
  run-ads2tex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install ads

      - name: Run ads2tex
        run: python ads2tex.py CV.tex
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}

      - name: Check if CV.tex changed
        id: check_changes
        run: |
          git diff --quiet CV.tex || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Install TeX Live
        if: steps.check_changes.outputs.changed == 'true'
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            collection-latex collection-latexrecommended
            fontawesome comment titlesec siunitx

      - name: Compile LaTeX
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          pdflatex CV.tex
          pdflatex CV.tex

      - name: Commit and push all changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "${{ github.event.inputs.commit_message || 'chore: weekly CV update' }}"
          git push
